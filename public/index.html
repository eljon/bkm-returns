<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BKM Returns</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --field: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-press: #0ea5e9;
      --ok: #22c55e;
      --err: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    header { padding: 8px 4px 18px; }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
    }
    label .req { color: var(--accent); }
    label .opt { color: var(--muted); font-weight: 500; }

    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 15px 14px;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus { border-color: var(--accent); }

    /* keep date control legible on iOS dark mode */
    input[type="date"] { color-scheme: dark; min-height: 52px; }

    /* Quantity stepper */
    .qty {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: stretch;
    }
    .qty button {
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .qty button:active { background: var(--border); }
    .qty input { text-align: center; }
    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty input[type=number] { -moz-appearance: textfield; }

    .submit {
      margin-top: 4px;
      background: var(--accent);
      color: #04293a;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .submit:active { background: var(--accent-press); }
    .submit:disabled { opacity: 0.6; cursor: default; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(4,41,58,0.35);
      border-top-color: #04293a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -3px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Recent returns list */
    .recent { margin-top: 30px; }
    .recent h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 10px 4px;
    }
    .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .recent li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .recent .r-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .recent .r-cust { font-weight: 700; }
    .recent .r-qty { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .recent .r-item { color: var(--text); font-size: 0.95rem; margin-top: 2px; }
    .recent .r-meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    .recent .empty { color: var(--muted); font-size: 0.9rem; padding: 4px; }

    /* Toast */
    .toast {
      position: fixed;
      left: 16px; right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      max-width: 488px;
      margin: 0 auto;
      padding: 15px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      text-align: center;
      transform: translateY(140%);
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateY(0); }
    .toast.ok { background: var(--ok); color: #052e16; }
    .toast.err { background: var(--err); color: #fff; }

    .hint { font-size: 0.8rem; color: var(--muted); margin-top: -2px; }

    /* Config banner */
    .banner {
      background: #422006;
      border: 1.5px solid #b45309;
      color: #fed7aa;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }
    .banner code { background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Item Returns</h1>
      <p>Log a return — saved to Firebase.</p>
    </header>

    <div class="banner hidden" id="configBanner">
      Firebase isn’t configured yet. Edit <code>public/firebase-config.js</code>
      with your project’s config to start saving returns.
    </div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="date">Date <span class="req">*</span></label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label for="customer">Customer <span class="req">*</span></label>
        <input type="text" id="customer" name="customer" list="customerList"
               placeholder="Start typing a name…" autocapitalize="words"
               enterkeyhint="next" required>
        <datalist id="customerList"></datalist>
      </div>

      <div class="field">
        <label for="item">Item <span class="req">*</span></label>
        <input type="text" id="item" name="item"
               placeholder="e.g. Coffee Mug" autocapitalize="sentences"
               enterkeyhint="next" required>
      </div>

      <div class="field">
        <label for="qty">QTY <span class="req">*</span></label>
        <div class="qty">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <input type="number" id="qty" name="qty" inputmode="numeric"
                 min="1" step="1" value="1" required>
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <div class="field">
        <label for="drNumber">DR # <span class="opt">(optional)</span></label>
        <input type="text" id="drNumber" name="drNumber"
               placeholder="Delivery receipt number" inputmode="text"
               enterkeyhint="done">
      </div>

      <button type="submit" class="submit" id="submitBtn">Save return</button>
    </form>

    <section class="recent">
      <h2>Recent returns</h2>
      <ul id="recentList">
        <li class="empty" id="recentEmpty">Loading…</li>
      </ul>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
