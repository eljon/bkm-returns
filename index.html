<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#dbeafe">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BKM ITEM RETURNS</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-2: #38bdf8;
      --accent-press: #0369a1;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 20px;
      --glass: rgba(255, 255, 255, 0.45);
      --glass-2: rgba(255, 255, 255, 0.62);
      --glass-brd: rgba(255, 255, 255, 0.7);
      --blur: saturate(180%) blur(20px);
      --edge: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      --shadow: 0 10px 30px rgba(30, 41, 59, 0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      background:
        radial-gradient(1200px 620px at 8% -12%, rgba(56, 189, 248, 0.42), transparent 60%),
        radial-gradient(1050px 720px at 112% 6%, rgba(167, 139, 250, 0.40), transparent 55%),
        radial-gradient(900px 700px at 50% 115%, rgba(244, 114, 182, 0.30), transparent 55%),
        linear-gradient(160deg, #eff6ff 0%, #f5f3ff 50%, #fdf2f8 100%);
      background-attachment: fixed;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    header { padding: 10px 4px 16px; }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    header h1 .version {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted);
      vertical-align: middle;
      letter-spacing: 0;
      margin-left: 4px;
    }

    /* Glass helpers via component styles below */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 5px;
      margin-bottom: 18px;
      border-radius: var(--radius);
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--shadow), var(--edge);
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-radius: 15px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s ease;
    }
    .tab.active {
      color: #fff;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35), var(--edge);
    }

    form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 0.92rem; font-weight: 600; color: var(--muted); }
    label .req { color: var(--accent); }

    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      color: var(--text);
      border-radius: var(--radius);
      padding: 15px 14px;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background: var(--glass-2);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--edge);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      border-color: rgba(2, 132, 199, 0.75);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25), var(--edge);
    }
    input::placeholder { color: var(--muted); opacity: 0.85; }
    input[type="date"] { color-scheme: light; min-height: 52px; }

    /* Autocomplete dropdown */
    .combo { position: relative; }
    .suggest {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      margin: 0;
      padding: 6px;
      list-style: none;
      border-radius: var(--radius);
      max-height: 46vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 30;
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid var(--glass-brd);
      box-shadow: 0 16px 40px rgba(30, 41, 59, 0.18), var(--edge);
    }
    .suggest[hidden] { display: none; }
    .suggest li {
      padding: 14px 12px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1.25;
    }
    .suggest li.active,
    .suggest li:active { background: rgba(2, 132, 199, 0.12); }
    .suggest li mark { background: transparent; color: var(--accent); font-weight: 700; }

    .section-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      margin: 6px 4px -4px;
    }
    #items { display: flex; flex-direction: column; gap: 12px; }

    .glass-card,
    .item-card,
    .txn {
      border-radius: var(--radius);
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--shadow), var(--edge);
    }
    .item-card { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .item-head { display: flex; align-items: center; justify-content: space-between; }
    .item-num { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .remove-item {
      background: none; border: none; color: var(--err);
      font-weight: 600; font-size: 0.85rem; cursor: pointer; padding: 4px 6px;
    }
    #items.single .remove-item { display: none; }

    .add-item {
      border-radius: var(--radius);
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.32);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1.5px dashed rgba(2, 132, 199, 0.5);
    }
    .add-item:active { background: rgba(2, 132, 199, 0.14); }

    /* Good / Defective picker */
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seg-btn {
      border-radius: var(--radius);
      padding: 14px;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
      color: var(--text);
      background: var(--glass-2);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--edge);
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .seg-btn.active[data-value="Good"] {
      background: linear-gradient(180deg, #22c55e, var(--ok)); color: #fff;
      border-color: transparent; box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35), var(--edge);
    }
    .seg-btn.active[data-value="Defective"] {
      background: linear-gradient(180deg, #f87171, var(--err)); color: #fff;
      border-color: transparent; box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35), var(--edge);
    }

    /* Quantity stepper */
    .qty { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: stretch; }
    .qty button {
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      background: var(--glass-2);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--edge);
    }
    .qty button:active { background: rgba(2, 132, 199, 0.14); }
    .qty input { text-align: center; }
    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty input[type=number] { -moz-appearance: textfield; }

    .submit {
      margin-top: 4px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: var(--radius);
      padding: 17px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.4), var(--edge);
      transition: filter 0.15s ease, opacity 0.15s ease;
    }
    .submit:active { filter: brightness(0.94); }
    .submit:disabled { opacity: 0.65; cursor: default; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -3px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* History + SR lists */
    #search { margin-bottom: 12px; }
    #recentList, #srList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .txn { padding: 12px 14px; }
    .r-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .r-cust { font-weight: 700; }
    .r-count { color: var(--muted); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .r-lines { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .r-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 0.95rem; }
    .r-line-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .r-line-sup { color: var(--muted); font-size: 0.78rem; }
    .r-line-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .r-qty { color: var(--accent); font-weight: 700; }
    .r-meta { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .badge.good { background: rgba(22, 163, 74, 0.18); color: #166534; }
    .badge.bad { background: rgba(220, 38, 38, 0.16); color: #991b1b; }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 10px 4px; }

    /* SR checkboxes */
    .sr-hint { color: var(--muted); font-size: 0.85rem; margin: 0 4px 12px; }
    .sr-items { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .sr-item { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 2px; cursor: pointer; }
    .sr-check {
      position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
      opacity: 0; -webkit-appearance: none; appearance: none;
    }
    .sr-box {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      border: 1.5px solid rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      position: relative;
      display: inline-block;
    }
    .sr-check:checked + .sr-box {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      border-color: transparent;
    }
    .sr-check:checked + .sr-box::after {
      content: "";
      position: absolute;
      left: 8px; top: 3px;
      width: 6px; height: 12px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }
    .sr-item-text { flex: 1; font-size: 0.95rem; min-width: 0; }
    .sr-item-text .muted { color: var(--muted); font-size: 0.82rem; }
    .sr-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
    .sr-save {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: var(--radius);
      padding: 0 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 52px;
      font-family: inherit;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.35), var(--edge);
    }
    .sr-save:active { filter: brightness(0.94); }
    .sr-save:disabled { opacity: 0.65; }

    /* Toast */
    .toast {
      position: fixed;
      left: 16px; right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      max-width: 488px;
      margin: 0 auto;
      padding: 15px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      text-align: center;
      transform: translateY(140%);
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
      z-index: 50;
      color: #fff;
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.28), var(--edge);
    }
    .toast.show { transform: translateY(0); }
    .toast.ok { background: rgba(22, 163, 74, 0.9); }
    .toast.err { background: rgba(220, 38, 38, 0.9); }

    /* Config banner */
    .banner {
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 16px;
      color: #9a3412;
      background: rgba(255, 247, 237, 0.7);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid rgba(253, 186, 116, 0.8);
      box-shadow: var(--edge);
    }
    .banner code { background: rgba(0, 0, 0, 0.06); padding: 1px 5px; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <!-- Bump this version on each new set of requested changes. -->
      <h1>BKM ITEM RETURNS <span class="version">v2.9</span></h1>
    </header>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="input">Input</button>
      <button type="button" class="tab" data-tab="sr">SR</button>
      <button type="button" class="tab" data-tab="history">History</button>
    </nav>

    <div class="banner hidden" id="configBanner">
      Firebase isn’t configured yet. Edit <code>firebase-config.js</code>
      with your project’s config to start saving returns.
    </div>

    <!-- INPUT TAB -->
    <section id="tab-input" class="tab-panel">
      <form id="form" autocomplete="off">
        <div class="field">
          <label for="date">Date <span class="req">*</span></label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="field">
          <div class="combo">
            <input type="text" id="customer" name="customer" placeholder="Customer *"
                   autocapitalize="characters" autocomplete="off" autocorrect="off"
                   spellcheck="false" role="combobox" aria-autocomplete="list"
                   aria-expanded="false" enterkeyhint="next" required>
            <ul class="suggest" id="customerSuggest" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="field">
          <input type="text" id="drNumber" name="drNumber" placeholder="DR # (optional)"
                 inputmode="text" enterkeyhint="next">
        </div>

        <div class="section-label">Items</div>
        <div id="items"></div>

        <button type="button" class="add-item" id="addItem">+ Add another item</button>

        <button type="submit" class="submit" id="submitBtn">Save return</button>
      </form>
    </section>

    <!-- SR TAB -->
    <section id="tab-sr" class="tab-panel hidden">
      <p class="sr-hint">Transactions still needing an SR number (those without a DR).</p>
      <ul id="srList">
        <li class="empty">Loading…</li>
      </ul>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="tab-panel hidden">
      <input type="text" id="search" placeholder="Search customer, supplier, item…"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <ul id="recentList">
        <li class="empty" id="recentEmpty">Loading…</li>
      </ul>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Template for one item line -->
  <template id="itemTemplate">
    <div class="item-card">
      <div class="item-head">
        <span class="item-num">Item 1</span>
        <button type="button" class="remove-item">Remove</button>
      </div>

      <div class="field">
        <div class="combo">
          <input type="text" class="i-item" placeholder="Item *"
                 autocapitalize="sentences" autocomplete="off" enterkeyhint="next">
          <ul class="suggest" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="field">
        <div class="combo">
          <input type="text" class="i-supplier" placeholder="Supplier *"
                 autocapitalize="characters" autocomplete="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="next">
          <ul class="suggest" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label>Condition <span class="req">*</span></label>
        <div class="segment" role="group" aria-label="Condition">
          <button type="button" class="seg-btn" data-value="Good" aria-pressed="false">Good</button>
          <button type="button" class="seg-btn" data-value="Defective" aria-pressed="false">Defective</button>
        </div>
      </div>

      <div class="field">
        <label>QTY <span class="req">*</span></label>
        <div class="qty">
          <button type="button" class="qty-minus" aria-label="Decrease quantity">−</button>
          <input type="number" class="i-qty" inputmode="numeric" min="1" step="1" value="1">
          <button type="button" class="qty-plus" aria-label="Increase quantity">+</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Bump ?v= together with the version tag so phones fetch fresh JS. -->
  <script type="module" src="app.js?v=2.9"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
