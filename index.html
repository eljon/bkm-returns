<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BKM ITEM RETURNS</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --field: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-press: #0369a1;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    header { padding: 8px 4px 18px; }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
    }
    label .req { color: var(--accent); }
    label .opt { color: var(--muted); font-weight: 500; }

    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 15px 14px;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus { border-color: var(--accent); }

    input[type="date"] { color-scheme: light; min-height: 52px; }

    /* Customer autocomplete */
    .combo { position: relative; }
    .suggest {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      margin: 0;
      padding: 6px;
      list-style: none;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      max-height: 46vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 30;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
    }
    .suggest[hidden] { display: none; }
    .suggest li {
      padding: 14px 12px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1.25;
    }
    .suggest li.active,
    .suggest li:active { background: #eef2f7; }
    .suggest li mark { background: transparent; color: var(--accent); font-weight: 700; }
    .suggest .none { color: var(--muted); font-size: 0.9rem; padding: 12px; }

    /* Items section */
    .section-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      margin: 6px 4px -4px;
    }
    #items { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .item-head { display: flex; align-items: center; justify-content: space-between; }
    .item-num { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .remove-item {
      background: none;
      border: none;
      color: var(--err);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 6px;
    }
    #items.single .remove-item { display: none; }

    .add-item {
      background: none;
      border: 1.5px dashed var(--border);
      color: var(--accent);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
    }
    .add-item:active { background: #eef2f7; }

    /* Good / Defective segmented picker */
    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .seg-btn {
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .seg-btn:active { background: #eef2f7; }
    .seg-btn.active[data-value="Good"] {
      background: var(--ok); border-color: var(--ok); color: #fff;
    }
    .seg-btn.active[data-value="Defective"] {
      background: var(--err); border-color: var(--err); color: #fff;
    }

    /* Quantity stepper */
    .qty {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: stretch;
    }
    .qty button {
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .qty button:active { background: #eef2f7; }
    .qty input { text-align: center; }
    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty input[type=number] { -moz-appearance: textfield; }

    .submit {
      margin-top: 4px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .submit:active { background: var(--accent-press); }
    .submit:disabled { opacity: 0.6; cursor: default; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -3px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Recent returns list */
    .recent { margin-top: 30px; }
    .recent h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 10px 4px;
    }
    .recent > ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .recent .txn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .recent .r-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .recent .r-cust { font-weight: 700; }
    .recent .r-count { color: var(--muted); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .r-lines { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    .r-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 0.95rem; }
    .r-line-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .r-qty { color: var(--accent); font-weight: 700; }
    .recent .r-meta { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .badge.good { background: #dcfce7; color: #166534; }
    .badge.bad { background: #fee2e2; color: #991b1b; }
    .recent .empty { color: var(--muted); font-size: 0.9rem; padding: 4px; }

    /* Toast */
    .toast {
      position: fixed;
      left: 16px; right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      max-width: 488px;
      margin: 0 auto;
      padding: 15px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      text-align: center;
      transform: translateY(140%);
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
      z-index: 50;
      box-shadow: 0 10px 30px rgba(15,23,42,0.18);
    }
    .toast.show { transform: translateY(0); }
    .toast.ok { background: var(--ok); color: #fff; }
    .toast.err { background: var(--err); color: #fff; }

    /* Config banner */
    .banner {
      background: #fff7ed;
      border: 1.5px solid #fdba74;
      color: #9a3412;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }
    .banner code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>BKM ITEM RETURNS</h1>
    </header>

    <div class="banner hidden" id="configBanner">
      Firebase isn’t configured yet. Edit <code>firebase-config.js</code>
      with your project’s config to start saving returns.
    </div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="date">Date <span class="req">*</span></label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label for="customer">Customer <span class="req">*</span></label>
        <div class="combo">
          <input type="text" id="customer" name="customer"
                 placeholder="Start typing a name…" autocapitalize="characters"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="custSuggest" enterkeyhint="next" required>
          <ul class="suggest" id="custSuggest" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label for="drNumber">DR # <span class="opt">(optional)</span></label>
        <input type="text" id="drNumber" name="drNumber"
               placeholder="Delivery receipt number" inputmode="text"
               enterkeyhint="next">
      </div>

      <div class="section-label">Items</div>
      <div id="items"></div>

      <button type="button" class="add-item" id="addItem">+ Add another item</button>

      <button type="submit" class="submit" id="submitBtn">Save return</button>
    </form>

    <section class="recent">
      <h2>Recent returns</h2>
      <ul id="recentList">
        <li class="empty" id="recentEmpty">Loading…</li>
      </ul>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Template for one item line -->
  <template id="itemTemplate">
    <div class="item-card">
      <div class="item-head">
        <span class="item-num">Item 1</span>
        <button type="button" class="remove-item">Remove</button>
      </div>

      <div class="field">
        <label>Item <span class="req">*</span></label>
        <input type="text" class="i-item"
               placeholder="e.g. Coffee Mug" autocapitalize="sentences"
               enterkeyhint="next">
      </div>

      <div class="field">
        <label>Condition <span class="req">*</span></label>
        <div class="segment" role="group" aria-label="Condition">
          <button type="button" class="seg-btn" data-value="Good" aria-pressed="false">Good</button>
          <button type="button" class="seg-btn" data-value="Defective" aria-pressed="false">Defective</button>
        </div>
      </div>

      <div class="field">
        <label>QTY <span class="req">*</span></label>
        <div class="qty">
          <button type="button" class="qty-minus" aria-label="Decrease quantity">−</button>
          <input type="number" class="i-qty" inputmode="numeric" min="1" step="1" value="1">
          <button type="button" class="qty-plus" aria-label="Increase quantity">+</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
