<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <title>BKM Returns</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --field: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-press: #0ea5e9;
      --ok: #22c55e;
      --err: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    header {
      padding: 8px 4px 18px;
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
    }
    label .req { color: var(--accent); }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    textarea {
      width: 100%;
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 15px 14px;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }

    /* keep date control legible on iOS dark mode */
    input[type="date"] { color-scheme: dark; min-height: 52px; }

    textarea { resize: vertical; min-height: 84px; line-height: 1.4; }

    /* Quantity stepper */
    .qty {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: stretch;
    }
    .qty button {
      background: var(--field);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .qty button:active { background: var(--border); }
    .qty input { text-align: center; }
    /* hide native number spinners */
    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty input[type=number] { -moz-appearance: textfield; }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--field);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .toggle-row .tlabel { font-weight: 600; font-size: 1rem; color: var(--text); }
    .switch { position: relative; width: 56px; height: 32px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 26px; width: 26px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .switch input:checked + .slider { background: var(--ok); }
    .switch input:checked + .slider::before { transform: translateX(24px); }

    .submit {
      margin-top: 4px;
      background: var(--accent);
      color: #04293a;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .submit:active { background: var(--accent-press); }
    .submit:disabled { opacity: 0.6; cursor: default; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(4,41,58,0.35);
      border-top-color: #04293a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -3px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      left: 16px; right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      max-width: 488px;
      margin: 0 auto;
      padding: 15px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      text-align: center;
      transform: translateY(140%);
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateY(0); }
    .toast.ok { background: var(--ok); color: #052e16; }
    .toast.err { background: var(--err); color: #fff; }

    .hint { font-size: 0.8rem; color: var(--muted); margin-top: -2px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Item Returns</h1>
      <p>Log a return — saved straight to the sheet.</p>
    </header>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="date">Date <span class="req">*</span></label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label for="customer">Customer <span class="req">*</span></label>
        <input type="text" id="customer" name="customer" list="customerList"
               placeholder="Start typing a name…" autocapitalize="words"
               enterkeyhint="next" required>
        <datalist id="customerList"></datalist>
        <span class="hint" id="custHint">Loading customers…</span>
      </div>

      <div class="field">
        <label for="itemName">Item name <span class="req">*</span></label>
        <input type="text" id="itemName" name="itemName"
               placeholder="e.g. Coffee Mug" autocapitalize="sentences"
               enterkeyhint="next" required>
      </div>

      <div class="field">
        <label for="quantity">Quantity <span class="req">*</span></label>
        <div class="qty">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <input type="number" id="quantity" name="quantity" inputmode="numeric"
                 min="1" step="1" value="1" required>
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <div class="field">
        <div class="toggle-row">
          <span class="tlabel">With paper</span>
          <label class="switch">
            <input type="checkbox" id="withPaper">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" name="remarks" placeholder="Optional notes…"
                  autocapitalize="sentences" enterkeyhint="done"></textarea>
      </div>

      <button type="submit" class="submit" id="submitBtn">Save return</button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Default date to today (local).
    (function setToday() {
      var d = new Date();
      var off = d.getTimezoneOffset();
      var local = new Date(d.getTime() - off * 60000);
      document.getElementById('date').value = local.toISOString().slice(0, 10);
    })();

    // Quantity stepper.
    var qty = document.getElementById('quantity');
    document.getElementById('qtyMinus').addEventListener('click', function () {
      var v = parseInt(qty.value, 10) || 1;
      qty.value = Math.max(1, v - 1);
    });
    document.getElementById('qtyPlus').addEventListener('click', function () {
      var v = parseInt(qty.value, 10) || 0;
      qty.value = v + 1;
    });

    // Load customer list for autocomplete.
    var custHint = document.getElementById('custHint');
    function loadCustomers() {
      google.script.run
        .withSuccessHandler(function (names) {
          var dl = document.getElementById('customerList');
          dl.innerHTML = '';
          names.forEach(function (n) {
            var opt = document.createElement('option');
            opt.value = n;
            dl.appendChild(opt);
          });
          custHint.textContent = names.length
            ? names.length + ' customers — start typing to filter'
            : 'No saved customers yet — type a new name';
        })
        .withFailureHandler(function () {
          custHint.textContent = 'Could not load customer list (you can still type a name)';
        })
        .getCustomers();
    }
    loadCustomers();

    // Toast helper.
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg, kind) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = 'toast show ' + (kind || 'ok');
      toastTimer = setTimeout(function () {
        toast.className = 'toast ' + (kind || 'ok');
      }, 3200);
    }

    // Submit handler.
    var form = document.getElementById('form');
    var btn = document.getElementById('submitBtn');
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var payload = {
        date: document.getElementById('date').value,
        customer: document.getElementById('customer').value.trim(),
        itemName: document.getElementById('itemName').value.trim(),
        quantity: parseInt(qty.value, 10) || 0,
        withPaper: document.getElementById('withPaper').checked,
        remarks: document.getElementById('remarks').value.trim()
      };

      if (!payload.customer) { showToast('Customer is required', 'err'); return; }
      if (!payload.itemName) { showToast('Item name is required', 'err'); return; }
      if (!payload.quantity || payload.quantity < 1) { showToast('Quantity must be at least 1', 'err'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Saving…';

      google.script.run
        .withSuccessHandler(function () {
          showToast('Return saved ✓', 'ok');
          resetForm();
          loadCustomers();
          btn.disabled = false;
          btn.textContent = 'Save return';
        })
        .withFailureHandler(function (err) {
          showToast((err && err.message) ? err.message : 'Save failed — try again', 'err');
          btn.disabled = false;
          btn.textContent = 'Save return';
        })
        .saveReturn(payload);
    });

    function resetForm() {
      document.getElementById('customer').value = '';
      document.getElementById('itemName').value = '';
      qty.value = 1;
      document.getElementById('withPaper').checked = false;
      document.getElementById('remarks').value = '';
      document.getElementById('customer').focus();
    }
  </script>
</body>
</html>
